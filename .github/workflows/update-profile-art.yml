name: Update profile art

"on":
  schedule:
    - cron: "17 5 * * *" # ~07:17 Paris time (summer), daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Both scripts are stdlib-only: no pip install needed.
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/render_dashboard_svg.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contrib-heatmap.svg assets/stats-dashboard.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh contribution graph [skip ci]"
            git push
          fi
